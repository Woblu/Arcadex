# Run the tests on every push and pull request.
#
# The release workflow builds and publishes; it does not test, and a tag is
# the wrong moment to find out something is broken. This runs on ordinary
# pushes so a failure shows up beside the commit that caused it.
#
# The Rust tests run on Linux as well as Windows. Most of the work happens on
# Windows, and the code that only exists on Linux - where RetroArch and the
# standalone emulators are looked for, the Secret Service - otherwise only
# ever gets compiled when a release is cut.

name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - run: npm test
      - name: Build
        run: npx vite build

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # The same list the release workflow installs; the tauri crate builds
      # against WebKitGTK even when only its tests are wanted.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      # `tauri::generate_context!` reads the built frontend, so there has to
      # be one, even an empty one, for the crate to compile.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      - name: Test
        working-directory: src-tauri
        run: cargo test
